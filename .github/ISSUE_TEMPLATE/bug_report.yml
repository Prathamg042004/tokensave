name: Bug report
description: Something is not working as documented
title: "[bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please redact every API key before pasting anything.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The request you sent, with all keys redacted.
      render: bash
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How are you running TokenSave?
      options:
        - Hosted proxy (tokensave.vercel.app)
        - Self-hosted
        - SDK
        - Local development
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Which provider were you calling?
      options:
        - Anthropic
        - OpenAI
        - Google
        - Groq
        - Not provider specific
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit SHA
      placeholder: "0.1.0 or b4d1991"
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: "v20.11.0"

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact keys, prompts and any customer data.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I removed all API keys and secrets from this report
          required: true
