name: Scorecard

# OpenSSF Scorecard grades the repository's supply-chain posture: pinned
# actions, token permissions, branch protection, dangerous workflow patterns.
# Results land in the Security tab as code scanning alerts.
on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "18 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Supply-chain analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Keep results private until the score is something worth showing off.
          publish_results: false

      - name: Keep the raw report for 5 days
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: results.sarif
