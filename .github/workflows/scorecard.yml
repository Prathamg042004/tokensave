name: Scorecard

# OpenSSF Scorecard grades the repository's supply-chain posture: pinned
# actions, token permissions, branch protection, dangerous workflow patterns.
# Results land in the Security tab as code scanning alerts.
on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "18 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Supply-chain analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Keep results private until the score is something worth showing off.
          publish_results: false

      - name: Keep the raw report for 5 days
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: results.sarif
